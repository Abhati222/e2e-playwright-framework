     branches: [main, develop]
   pull_request:
     branches: [main]

jobs:
   build:
     runs-on: ubuntu-latest
     steps:
        - uses: actions/checkout@v4

        - name: Setup Environment
          run: echo "Setting up ... "

        - name: Run Tests
          run: npm test 

        - name: Build 
          run: npm run build 